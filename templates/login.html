<!DOCTYPE html>
<html>
<head>

<title>Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-100 flex items-center justify-center h-screen">

<div class="bg-white p-8 rounded-xl shadow w-80">

<h2 class="text-2xl font-bold text-center text-indigo-700 mb-6">
Login
</h2>

<form method="post">

{% csrf_token %}

<input type="text" name="username"
placeholder="Username"
class="w-full p-2 border rounded mb-3" required>

<input type="password" name="password"
placeholder="Password"
class="w-full p-2 border rounded mb-4" required>

<button class="w-full bg-indigo-600 text-white py-2 rounded">
Login
</button>

</form>
<!-- {% if error %}
<p class="text-red-600 text-center mb-3">{{ error }}</p>
{% endif %} -->
<p class="text-center mt-4 text-sm">
No account?
<a href="/signup/" class="text-indigo-600">Sign up</a>
</p>

</div>

</body>
</html>
