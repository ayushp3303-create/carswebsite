<!DOCTYPE html>
<html>
<head>

<title>Signup</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-100 flex items-center justify-center h-screen">

<div class="bg-white p-8 rounded-xl shadow w-80">

<h2 class="text-2xl font-bold text-center text-indigo-700 mb-6">
Sign Up
</h2>

<form method="post">

{% csrf_token %}

<input type="text" name="username"
placeholder="Username"
class="w-full p-2 border rounded mb-3" required>

<input type="password" name="password"
placeholder="Password"
class="w-full p-2 border rounded mb-3" required>

<select name="role"
class="w-full p-2 border rounded mb-4">

<option value="customer">Customer</option>
<option value="dealer">Dealer</option>

</select>

<button class="w-full bg-indigo-600 text-white py-2 rounded">
Create Account
</button>

</form>

</div>

</body>
</html>
